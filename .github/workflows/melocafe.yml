name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository with LFS
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Checkout LFS Objects
      run: git lfs pull

    - name: Set up Xcode
      run: |
        sudo xcode-select -switch /Applications/Xcode.app
        xcodebuild -version

    - name: Build App for Device (Unsigned)
      run: |
        WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
        PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
        
        if [ -n "$WORKSPACE" ]; then
          echo "Found workspace at: $WORKSPACE"
          xcodebuild -workspace "$WORKSPACE" -scheme "MeloCafe" -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
        elif [ -n "$PROJECT" ]; then
          echo "Found project at: $PROJECT"
          xcodebuild -project "$PROJECT" -scheme "MeloCafe" -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
        else
          echo "No Xcode project or workspace found!"
          exit 1
        fi

    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
        zip -r MeloCafe.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MeloCafe-IPA
        path: MeloCafe.ipa
