name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository with LFS
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Generate Valid Cemu Framework Stub
      run: |
        mkdir -p MeloCafe/Cemu.framework
        echo "void __Cemu_stub(void) {}" > cemu_stub.c
        xcrun clang -dynamiclib -arch arm64 -mios-version-min=14.0 cemu_stub.c -o MeloCafe/Cemu.framework/Cemu
        rm cemu_stub.c
        echo '<?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>com.cemu.framework</string><key>CFBundleExecutable</key><string>Cemu</string></dict></plist>' > MeloCafe/Cemu.framework/Info.plist
        file MeloCafe/Cemu.framework/Cemu

    - name: Set up Xcode
      run: |
        sudo xcode-select -switch /Applications/Xcode.app
        xcodebuild -version

    - name: Build App for Device (Unsigned)
      run: |
        WORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)
        PROJECT=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
        
        if [ -n "$WORKSPACE" ]; then
          xcodebuild -workspace "$WORKSPACE" -scheme "MeloCafe" -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
        else
          xcodebuild -project "$PROJECT" -scheme "MeloCafe" -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
        fi

    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -R ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/*.app Payload/
        zip -r MeloCafe.ipa Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MeloCafe-IPA
        path: MeloCafe.ipa
